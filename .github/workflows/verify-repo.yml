name: verify-repo

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: "10.0.x"

      - name: Determine reference evidence range
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "pull_request") {
            "USE_DIFF_RANGE=1" >> $env:GITHUB_ENV
            "REFERENCE_BASE_REF=${{ github.event.pull_request.base.sha }}" >> $env:GITHUB_ENV
            "REFERENCE_HEAD_REF=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_ENV
            exit 0
          }

          if ("${{ github.event_name }}" -eq "push" -and "${{ github.event.before }}" -and "${{ github.event.before }}" -ne "0000000000000000000000000000000000000000") {
            "USE_DIFF_RANGE=1" >> $env:GITHUB_ENV
            "REFERENCE_BASE_REF=${{ github.event.before }}" >> $env:GITHUB_ENV
            "REFERENCE_HEAD_REF=${{ github.sha }}" >> $env:GITHUB_ENV
            exit 0
          }

          "USE_DIFF_RANGE=0" >> $env:GITHUB_ENV

      - name: Run repository verification
        if: github.event_name != 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:USE_DIFF_RANGE -eq "1") {
            .\scripts\verify-repo.ps1 -Mode Full -ReferenceEvidenceBaseRef $env:REFERENCE_BASE_REF -ReferenceEvidenceHeadRef $env:REFERENCE_HEAD_REF
          }
          else {
            .\scripts\verify-repo.ps1 -Mode Full
          }

      - name: Run release preflight
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          .\scripts\preflight-release.ps1
